name: Publish

# Publishes the .vsix attached to a GitHub Release to the VS Code Marketplace
# and Open VSX. Started by release.yml on the release tag (a release created
# with GITHUB_TOKEN can't trigger `release: published`); a manual run must also
# pick the release tag under "Use workflow from". The stores get exactly the
# file attached to the GitHub Release, verified against the sha256 input —
# nothing is rebuilt here, and no npm install scripts run next to the
# publishing credentials.
# Open VSX trusts this file by name (trusted publisher Aswertus/cisco-lsp +
# publish.yml): renaming it breaks Open VSX publishing.
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 of the released .vsix (release.yml passes it; for a manual run copy it from that release run's log)
        required: true

jobs:
  publish-marketplace:
    name: Publish to VS Code Marketplace
    # Only the public release repo publishes; the private dev repo never does.
    # Only from a release tag — never from a branch.
    if: github.repository == 'Aswertus/cisco-lsp' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Marketplace trusted publishing (vsce --oidc) isn't live on the Marketplace
    # backend yet (2026-10), so this job still uses the VSCE_PAT secret: an Azure
    # DevOps PAT scoped to the `aswertus` organization (not a global PAT, so the
    # 2026-12-01 global-PAT retirement doesn't hit it), expiring 2027-10-12.
    # Renew it, or switch to --oidc, before then.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache in a job that holds publishing credentials (cache-poisoning
          # guidance in setup-node's docs); npm ci is fast enough without it.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the released VSIX
        run: scripts/ci/download-release-vsix.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}

      - name: Check the Marketplace token's end of life
        run: |
          if [[ $(date -u +%F) > 2027-09-11 ]]; then
            echo "::warning::The Azure DevOps PAT in VSCE_PAT expires on 2027-10-12. Renew it (dev.azure.com → User settings → Personal access tokens) or switch this job to 'vsce publish --oidc' + 'id-token: write' (see CLAUDE.md)."
          fi

      - name: Publish to VS Code Marketplace
        run: |
          npm run publish:vsce || {
            if [[ $(date -u +%F) > 2027-10-11 ]]; then
              echo "::error::Marketplace publish failed after 2027-10-12 — the Azure DevOps PAT in VSCE_PAT has most likely expired. Renew it or switch to 'vsce publish --oidc' (see CLAUDE.md)."
            fi
            exit 1
          }
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        timeout-minutes: 5

  publish-openvsx:
    name: Publish to Open VSX Registry
    # Only the public release repo publishes; the private dev repo never does.
    # Only from a release tag — never from a branch.
    if: github.repository == 'Aswertus/cisco-lsp' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): the registry trusts this repo + workflow file,
    # so no long-lived token is stored as a secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache in a job that holds publishing credentials (cache-poisoning
          # guidance in setup-node's docs); npm ci is fast enough without it.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the released VSIX
        run: scripts/ci/download-release-vsix.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}

      - name: Publish to Open VSX Registry
        run: npm run publish:ovsx
        timeout-minutes: 5
